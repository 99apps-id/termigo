name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Audit (advisory)
        run: pnpm audit --prod --audit-level high
        continue-on-error: true

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm check-types

      - name: Invoke/command registration guard
        run: pnpm check:commands

      - name: CLI version stamp guard
        run: pnpm check:cli-version

      - name: Test
        run: pnpm test

      # The build scripts are outside `src`, so vitest does not reach them. What
      # lives there is the mapping from a Rust target triple to the names Go and
      # Node use, which is the only place a release asset can be named wrongly -
      # and a wrongly named asset is a 404 a user sees, not a build failure.
      - name: Test build scripts
        run: pnpm test:scripts

      - name: React Compiler healthcheck (advisory)
        run: pnpm exec react-compiler-healthcheck
        continue-on-error: true

      - name: Build frontend
        run: pnpm build

      - name: Size budget
        run: pnpm size

      - name: Dead code (advisory)
        run: pnpm knip
        continue-on-error: true

      - name: Version parity (package.json vs tauri.conf.json)
        run: node -e "const pkg=require('./package.json'); const tauri=require('./src-tauri/tauri.conf.json'); if (pkg.version !== tauri.version) { console.error('version mismatch:', pkg.version, '!==', tauri.version); process.exit(1); }"

  go-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: cli/go.sum

      - name: gofmt
        working-directory: cli
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        working-directory: cli
        run: go vet ./...

      - name: go test
        working-directory: cli
        run: go test ./...

  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fish \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - uses: taiki-e/install-action@v2.85.11
        with:
          tool: cargo-nextest,cargo-machete

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --all-targets --locked

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Unused crates (advisory)
        working-directory: src-tauri
        run: cargo machete
        continue-on-error: true

      - name: cargo nextest
        working-directory: src-tauri
        run: cargo nextest run --locked

      - name: fish shell integration
        run: fish --no-config src-tauri/src/modules/pty/scripts/init.test.fish

  rust-platforms:
    name: rust-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - uses: taiki-e/install-action@v2.85.11
        with:
          tool: cargo-nextest

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --all-targets --locked

      - name: cargo nextest
        working-directory: src-tauri
        run: cargo nextest run --locked --retries 2

  # End-to-end smoke: boot the REAL app via tauri-driver + WebdriverIO and check
  # it starts, mounts the UI and spawns a terminal — the integration path unit
  # tests can't reach. Required: failing to boot is the one regression no unit
  # test can catch, so this job has to be able to fail the workflow.
  e2e:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build + webdriver dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            webkit2gtk-driver \
            xvfb

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: e2e

      - uses: taiki-e/install-action@v2.85.11
        with:
          tool: tauri-driver

      - name: Install app dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the app (no bundle)
        run: pnpm tauri build --no-bundle

      - name: Install e2e dependencies
        working-directory: e2e
        # e2e has its own pnpm-workspace.yaml (allowBuilds for the WebdriverIO
        # driver postinstalls), so it is its own workspace root. NO
        # --ignore-workspace: that flag would skip the local workspace file and
        # pnpm 11 would hard-error with ERR_PNPM_IGNORED_BUILDS on the drivers.
        run: pnpm install --no-frozen-lockfile

      - name: Run e2e smoke tests
        working-directory: e2e
        run: xvfb-run -a pnpm test

  coverage:
    runs-on: ubuntu-22.04
    needs: rust
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: coverage

      - uses: taiki-e/install-action@v2.85.11
        with:
          tool: cargo-llvm-cov,cargo-nextest

      - name: Generate coverage
        working-directory: src-tauri
        run: cargo llvm-cov nextest --locked --lcov --output-path lcov.info

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: lcov-report
          path: src-tauri/lcov.info
          if-no-files-found: error
