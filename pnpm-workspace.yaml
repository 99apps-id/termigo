packages:
  - '.'

# LOCAL ENVIRONMENT OVERRIDE, not a project convention. Remove on a machine
# where reparse points resolve: TERMIGO.md asks for pnpm's default isolated
# layout, and pnpm-workspace.yaml is the only place pnpm 11 still reads this
# setting (it ignores `node-linker` in .npmrc).
#
# Why: this machine creates junctions and directory symlinks but cannot then
# traverse them ("UNKNOWN" from Node, "File Not Found" from dir) anywhere on C:,
# including the home directory. fsutil confirms a well-formed mount point
# (tag 0xa0000003, correct substitute and print name) that simply cannot be
# followed, and Developer Mode does not change it. Hardlinks work. With the
# isolated layout every top-level dependency is such a link, so react,
# typescript, vite, vitest and knip all fail to resolve and no check can run.
nodeLinker: hoisted

minimumReleaseAge: 0
minimumReleaseAgeStrict: false
allowBuilds:
  esbuild: true
  msgpackr-extract: false
  msw: true

# Patched versions of transitive dependencies flagged by `pnpm audit`.
# dompurify and nanoid arrive through streamdown -> mermaid; there is no direct
# dependency to bump for them, so they are pinned here until streamdown ships
# the newer tree. mermaid itself is a DIRECT dependency (^11.16.1), so it needs
# no override: pnpm dedupes streamdown's mermaid to that single instance, and
# pnpm >= 11 rejects an override that conflicts with a direct dependency.
overrides:
  '@ai-sdk/provider-utils': '>=4.0.33'
  dompurify: '>=3.4.9'
  nanoid: '>=3.3.18'
